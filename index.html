<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Masmorra</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #1a1420;
      color: #ece5f0;
      max-width: 640px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { text-align: center; color: #e0b34a; }
    h2, h3 { margin: 4px 0; }
    #ficha, #inimigo {
      background: #2a2233;
      border: 1px solid #443a52;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    #inimigo { border-color: #6a3040; }
    .barra {
      background: #443a52;
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      margin: 6px 0;
    }
    .barra-cheia { background: linear-gradient(90deg,#4caf50,#8bc34a); height: 100%; }
    #inimigo .barra-cheia { background: linear-gradient(90deg,#c0392b,#e74c3c); }
    #acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      background: #6d4aa0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #7d57b5; }
    button:disabled { background: #444; cursor: not-allowed; opacity: .6; }
    #loja { margin-bottom: 12px; }
    #loja .item { background: #40632f; margin: 4px 4px 0 0; }
    #loja .item:hover { background: #4d7639; }
    #log {
      background: #14101a;
      border-radius: 8px;
      padding: 8px 14px;
      height: 200px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.4;
    }
    #log p { margin: 3px 0; }
    .vazio { color: #9a8fa8; font-style: italic; }
  </style>
</head>
<body>
  <h1>⚔️ A Masmorra</h1>

  <div id="ficha"></div>
  <div id="inimigo"></div>

  <div id="acoes">
    <button id="btnAtacar">Atacar</button>
    <button id="btnPocao">Usar Poção</button>
    <button id="btnDescer">Próximo Andar</button>
    <button id="btnNovo">Novo Jogo</button>
  </div>

  <div id="loja"></div>
  <div id="log"></div>

  <script src="game.js"></script>
</body>
</html>
